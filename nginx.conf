worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    server {
        server_name localhost *.misterdevops.xyz;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # File caching for static assets
        location ~* \.(?:css|js|woff|woff2|ttf|svg|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public";
        }

        access_log  /var/log/nginx/access.log  main;
    }

    sendfile        on;
    keepalive_timeout  65;

    # Enable gzip for performance improvement
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml text/javascript;
    gzip_min_length 1000;

    include /etc/nginx/conf.d/*.conf;
}
